---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
spec:
  data:
    - secretKey: GARAGE_ADDRESS
      remoteRef:
        key: garage
        property: GARAGE_ADDRESS
  dataFrom:
    - extract:
        key: cluster-secrets
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cluster-secrets
    template:
      data:
        # global
        CLUSTER_TIME_ZONE: "{{ .CLUSTER_TIME_ZONE }}"
        SECRET_DOMAIN: "{{ .EXTERNAL_DOMAIN }}"

        # networks
        NET_HOME_CIDR: "{{ .NET_HOME_CIDR }}"
        NET_K8S_POD_CIDR: "{{ .NET_K8S_POD_CIDR }}"
        NET_K8S_SERVICE_CIDR: "{{ .NET_K8S_SERVICE_CIDR }}"
        NET_SERVICES_CIDR: "{{ .NET_SERVICES_CIDR }}"

        # service addresses
        SVC_GATEWAY_EXTERNAL: "{{ .SVC_GATEWAY_EXTERNAL }}"
        SVC_GATEWAY_INTERNAL: "{{ .SVC_GATEWAY_INTERNAL }}"
        SVC_K8S_API: "{{ .SVC_K8S_API }}"

        # site addresses
        GARAGE_ADDRESS: "{{ .GARAGE_ADDRESS }}"
