---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-dns
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-dns
  interval: 1h
  values:
    domainFilters:
      - "${SECRET_DOMAIN}"
    fullnameOverride: "${APP}"
    podAnnotations:
      secret.reloader.stakater.com/reload: &secret unifi-dns-secret
    policy: sync
    provider:
      name: webhook
      webhook:
        env:
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: *secret
                key: UNIFI_API_KEY
          - name: UNIFI_HOST
            value: "https://unifi.${SECRET_DOMAIN}"
        extraArgs:
          - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
          - --crd-source-kind=DNSEndpoint
          - --gateway-name=envoy-internal
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.15@sha256:c469c3ad5098652b0c620f2c66dac68427124641193ea6698fb17fad74caee37
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    serviceMonitor:
      enabled: true
    sources:
      - gateway-httproute
      - service
    triggerLoopOnEvent: true
    txtOwnerId: main
    txtPrefix: k8s.main.%{record_type}-
