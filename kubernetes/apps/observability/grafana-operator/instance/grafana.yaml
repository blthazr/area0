---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_plugin_updates: "false"
      check_for_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    date_formats:
      default_timezone: CST
      use_browser_locale: "true"
      week_start: monday
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    server:
      enable_gzip: "true"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        metadata:
          annotations:
            secret.reloader.stakater.com/reload: grafana-oidc-credentials,grafana-secret
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GRAFANA_ADMIN_USERNAME
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GRAFANA_ADMIN_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - "ALL"
                readOnlyRootFilesystem: true
          securityContext:
            fsGroup: ${APP_PGID:=1000}
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: ${APP_PGID:=1000}
            runAsNonRoot: true
            runAsUser: ${APP_PUID:=1000}
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  disableDefaultSecurityContext: All
  httpRoute:
    spec:
      hostnames:
        - "${HOSTNAME:=${APP}}.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-block
