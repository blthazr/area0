---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dockerhub-rules
spec:
  groups:
    - name: dockerhub.rules
      rules:
        - alert: DockerHubRateLimitRisk
          annotations:
            description: >-
              Kubernetes cluster is at risk of being rate limited by DockerHub.
            # runbook_url:
            summary: >-
              There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
          expr: |-
            count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          labels:
            severity: critical
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oom-rules
spec:
  groups:
    - name: oom.rules
      rules:
        - alert: OOMKilled
          annotations:
            description: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled.
            # runbook_url:
            summary: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: |-
            (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zfs-rules
spec:
  groups:
    - name: zfs.rules
      rules:
        - alert: ZfsUnexpectedPoolState
          annotations:
            description: >-
              ZFS pool is in an unexpected state.
            # runbook_url:
            summary: >-
              ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in an unexpected state {{$labels.state}}.
          expr: |-
            node_zfs_zpool_state{state!="online"} > 0
          for: 5m
          labels:
            severity: critical
