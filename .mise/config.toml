[env]
# file paths
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
TF_CLI_CONFIG_FILE = "{{config_root}}/terraform/.terraformrc"

# dotenv
_.file = ["{{ config_root }}/.secrets.env"]

# python
_.python.venv = { path = "{{config_root}}/.venv", create = true }

# just
JUST_UNSTABLE = "1"

[settings]
pipx.uvx = true

[tasks."hooks:install"]
description = "Install the local pre-commit Git hook using mise-pinned pre-commit"
run = ['pre-commit install --install-hooks --overwrite']

[tasks."secrets:env"]
description = "Inject 1Password secrets from .op.env into .secrets.env"
run = ['op inject -i .op.env -o .secrets.env']

[tools]
"aqua:a8m/envsubst" = "1.4.3"
"aqua:astral-sh/uv" = "0.12.17"
"aqua:casey/just" = "1.58.0"
"aqua:charmbracelet/gum" = "2.0.1"
"aqua:evilmartians/lefthook" = "2.1.14"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:hashicorp/terraform" = "1.16.3"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:siderolabs/talos" = "v1.14.1"
"aqua:zizmorcore/zizmor" = "1.30.1"
"github:mitsuhiko/minijinja" = "2.24.0"
"pipx:ansible-core" = "2.21.4"
"pipx:ansible-lint" = "26.8.0"
"pipx:ansible" = "14.4.0"

[hooks]
postinstall = ["lefthook install"]
